:root{color-scheme:light dark;
--bg:light-dark(#eef4ff,#0b1426);--card:light-dark(#fff,#13213b);--ink:light-dark(#0f1d3a,#e9f0ff);--mute:light-dark(#5b6b86,#9fb0cf);

[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.top{background:linear-gradient(135deg,#1e7bff,#1152d6 60%,#0d44b8);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 34px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:11px}
.logo{width:46px;height:46px;flex:none;background:#fff;border-radius:12px;display:grid;place-items:center;box-shadow:0 6px 16px #0004;transform:rotate(-6deg)}
.gear.help{margin-left:auto;width:40px}.gear.help+.gear{width:40px}
.top h1{margin:0;font-size:25px;line-height:1.05;font-weight:800;letter-spacing:-.5px}.top h1 b{color:var(--yel)}

.exam-pill{display:flex;align-items:center;gap:7px;margin:-25px 12px 0;position:relative;background:#0d3fa8;color:#fff;border-radius:12px;padding:6px 12px;font-size:13px;box-shadow:0 6px 18px #0b3a9a44;width:calc(100% - 24px);text-align:left}
.exam-pill span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.exam-pill small{opacity:.8}
.wrap{padding:9px 12px}
.hero{background:linear-gradient(160deg,light-dark(#fff,#16284a),light-dark(#e6f0ff,#122244));border:2px solid #4b8dff;border-radius:18px;padding:11px 12px 12px;box-shadow:0 8px 20px #1565e81f}

.ready.no{background:light-dark(#fff3d6,#3b2a08);color:light-dark(#92400e,#fcd34d)}
.hero-body{display:grid;grid-template-columns:88px minmax(0,1fr);grid-template-areas:"a t" "a b";gap:8px 12px;margin-top:8px}.art{grid-area:a;align-self:center}.htxt{grid-area:t}.hero-body .go{grid-area:b}
.hero h2{margin:0 0 3px;font-size:clamp(18px,5vw,23px);line-height:1.12;font-weight:800;text-wrap:balance}
.hero p{margin:0;color:var(--mute);font-size:12.5px;line-height:1.4}
.go{width:100%;min-height:48px;border-radius:99px;background:linear-gradient(90deg,#1d74ff,#0f4fd6);color:#fff;font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 6px 16px #1565e855;white-space:nowrap}.go svg:first-child{width:26px;height:23px}.go svg:last-child{width:18px;height:18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px}

.btn.ghost{background:var(--soft);color:var(--ink)}.btn.red{background:light-dark(#fde2e7,#3d1420);color:var(--bad)}.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns .btn{flex:1 1 140px}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}
label.f input,label.f select,label.f textarea,input.in,textarea.in,select.in{display:block;width:100%;margin-top:4px;min-height:42px;padding:8px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left}th{font-size:13px;color:var(--mute);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

function binarize(g,w,h){

 for(let y=0;y<h;y++){let row=0;for(let x=0;x<w;x++){row+=g[y*w+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+row}}

 return`${sub(LAST.demo?'Thử với phiếu mẫu':'Kết quả chấm')}<div class="wrap">${LAST.demo&&!LAST.saved?`<div class="card tip"><b>Đây là phiếu mẫu app tự tô</b> theo đáp án mã ${esc(LAST.demo)}, cố ý sai vài câu, để bạn xem app chấm thế nào. Ảnh phiếu ở cuối trang: xanh lá = đúng, đỏ = sai, vàng = chưa làm.<div class="btns"><button class="btn" data-act="scan">Quét phiếu thật</button><button class="btn ghost" data-act="keepDemo">Lưu thử vào bảng điểm</button></div></div>`:''}<div class="card"><div style="display:flex;gap:14px;align-items:center"><div><div class="big">${res?fmt(res.score):'—'}</div><div class="muted small">/ ${fmt(maxOf(e))} điểm</div></div><div class="grow"><b>${esc(name||'Chưa có trong danh sách')}</b><div class="muted small">SBD ${esc(r.sbd)} · Mã đề ${esc(r.made)}</div>${!known?`<span class="tag bad">Mã đề ${esc(r.made)} chưa có đáp án</span>`:LAST.saved?`<span class="tag ok">${LAST.saved==='updated'?'Đã cập nhật':'Đã lưu'}</span>`:''}</div></div>${res?partChips(e,res):''}</div>
 <div class="card"><h4>Sửa nếu đọc sai</h4><div class="grid2"><label class="f">SBD<input id="rSbd" value="${esc(r.sbd)}" inputmode="numeric" maxlength="${TP[e.tpl].sbd.length}"></label><label class="f">Mã đề<input id="rMade" value="${esc(r.made)}" inputmode="numeric" maxlength="${TP[e.tpl].made.length}"></label></div><div class="btns"><button class="btn" data-act="resSave">${LAST.saved?'Lưu lại':'Lưu kết quả'}</button><button class="btn ghost" data-act="again">Phiếu tiếp theo</button></div></div>
 <div class="card">${ansHTML(e,{...r,made:r.made})}</div>

 <div class="card"><h4>Ảnh phiếu đã chấm</h4><img id="sheetImg" class="res-img" alt="Phiếu đã chấm: xanh lá đúng, đỏ sai, vàng chưa làm" style="min-height:120px;background:var(--soft)"><div class="btns"><button class="btn" id="sheetDl" data-act="sheetOne" hidden>Tải ảnh phiếu</button></div></div>
 ${edD?editHTML(e,r):`<div class="card">${ansHTML(e,r)}${r.edited?`<p class="muted small" style="margin:6px 0 0">Đã sửa tay lúc ${new Date(r.edited).toLocaleString('vi-VN')}</p>`:''}</div>`}
 <div class="btns">${edD?'':'<button class="btn" data-act="edStart">Sửa bài làm</button><button class="btn ghost" data-act="rereadOne">Đọc lại từ ảnh</button>'}<button class="btn red" data-act="delRes" data-id="${r.id}">Xoá bài này</button></div></div>`};
V.history=()=>{const all=S.exams.flatMap(e=>e.results.map(r=>({...r,e}))).sort((a,b)=>b.t-a.t).slice(0,150),src={camera:'Camera',image:'Ảnh',pdf:'PDF',batch:'Hàng loạt'};
 return`<div class="sub"><h2 style="padding-left:10px">Lịch sử chấm</h2></div><div class="wrap"><div class="card">${all.length?`<ul class="list">${all.map(r=>`<li data-act="histOpen" data-e="${r.e.id}" data-id="${r.id}" style="cursor:pointer"><div class="grow"><b>${esc(stu(r.sbd)?.name||'SBD '+r.sbd)}</b><div class="muted small">${esc(r.e.name)} · mã ${esc(r.made)} · ${src[r.src]||''} · ${new Date(r.t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}</div></div><span class="score">${fmt(r.score)}</span></li>`).join('')}</ul>`:'<div class="empty">Chưa có lần chấm nào.</div>'}</div></div>`};
V.stats=()=>{const e=ex(),s=summary(e);return`<div class="sub"><h2 style="padding-left:10px">Thống kê</h2></div>${examLine(e,1)}<div class="wrap"><div class="stats4" style="margin-bottom:10px"><div><b>${s.n}</b>Bài đã chấm</div><div><b>${fmt(s.avg)}</b>Điểm TB / ${fmt(s.mx)}</div><div><b>${fmt(s.max)}</b>Cao nhất</div><div><b>${Math.round(s.pass)}%</b>Đạt ≥ ${fmt(s.mx/2)}</div></div>
 <section class="panel"><div class="row4"><button data-go="scores">${IC.pie}Bảng điểm</button><button data-go="dist">${IC.bars}Phổ điểm</button><button data-go="analysis">${IC.analyze}Phân tích câu hỏi</button><button data-go="export">${IC.excel}Xuất Excel / PDF</button></div></section></div>`};
V.account=()=>`<div class="sub"><h2 style="padding-left:10px">Tài khoản &amp; cài đặt</h2><button data-go="guide" aria-label="Hướng dẫn" style="font-weight:800;font-size:20px">?</button></div><div class="wrap">${accCard()}${syCard()}<div class="card"><h4>Giáo viên</h4><label class="f">Họ tên<input id="aT" value="${esc(S.settings.teacher)}"></label><label class="f">Trường<input id="aS" value="${esc(S.settings.school)}"></label></div>
 <div class="card"><h4>Nhận diện</h4><label class="f">Độ nhạy ô tô: <b id="thrV">${S.settings.thr}</b><input id="aThr" type="range" min="0.25" max="0.65" step="0.01" value="${S.settings.thr}" style="min-height:30px"></label><p class="muted small" style="margin-top:-4px">Giảm nếu ô tô nhạt bị bỏ sót; tăng nếu vết bẩn bị nhận là ô tô.</p>
 <label style="display:flex;gap:10px;align-items:center;min-height:40px"><input type="checkbox" id="aSound" ${S.settings.sound?'checked':''} style="width:20px;height:20px"> Âm báo khi chấm xong</label><p class="muted small" style="margin:0">Số câu và cách tính điểm từng phần đặt riêng cho mỗi kỳ thi (Quản lý bài thi → Sửa cấu trúc).</p></div>
 <div class="btns"><button class="btn" data-act="accSave">Lưu cài đặt</button></div>
 <div class="card" style="margin-top:10px"><h4>Cài ứng dụng lên điện thoại</h4>${isStandalone()?'<p class="small" style="margin:0;color:var(--ok)">✓ Đang chạy như ứng dụng đã cài.</p>':canInstall()?'<div class="btns" style="margin-top:0"><button class="btn" data-act="install">Cài QUMIRAI</button></div>':'<p class="muted small" style="margin:0">Mở QUMIRAI bằng Chrome qua địa chỉ web của thầy (GitHub Pages), rồi chọn <b>⋮ → Cài đặt ứng dụng</b> (iPhone: <b>Chia sẻ → Thêm vào MH chính</b>). Trong ứng dụng Claude không cài được.</p>'}<div class="btns"><button class="btn ghost" data-act="guideAt" data-g="install">Xem hướng dẫn cài</button></div></div><div class="card"><h4>Hướng dẫn</h4><div class="btns" style="margin-top:0"><button class="btn" data-go="guide">Xem hướng dẫn sử dụng</button><button class="btn ghost" data-act="demo">Thử phiếu mẫu</button></div></div><div class="card"><h4>Quản lý</h4><div class="btns" style="margin-top:0"><button class="btn ghost" data-go="exams">Các kỳ thi</button><button class="btn ghost" data-go="codes">Mã đề</button><button class="btn ghost" data-go="students">Học sinh</button></div></div><div class="card"><h4>Dữ liệu</h4><p class="muted small" style="margin:0 0 4px">Xoá mã đề, bài đã chấm, ảnh phiếu, danh sách học sinh… theo từng mục.</p><div class="btns" style="margin-top:6px">${S.hasSample?'<button class="btn ghost" data-act="clearSample">Xoá dữ liệu mẫu</button>':''}<button class="btn ghost" data-go="export">Sao lưu / khôi phục</button><button class="btn red" data-act="cleanOpen">Xoá dữ liệu…</button></div></div>
 <div class="card about"><h4>Giới thiệu</h4><b>${APP_FULL}</b> <span class="tag">Phiên bản ${VER}</span> <span class="muted small">cập nhật ${VER_DATE}</span><p><i>${esc(SLOGAN)}</i></p><p>Hệ thống chấm thi trắc nghiệm theo mẫu phiếu trả lời 2025.</p><p>Phát triển bởi <b>thầy Phan Đình Trung</b><br>Trường THPT Chu Văn An, phường Bảo An, tỉnh Khánh Hòa.</p><details class="chg"><summary>Có gì mới</summary><ul>${CHANGES.map(([v,t])=>`<li><b>${v}</b> — ${esc(t)}</li>`).join('')}</ul></details><p class="muted small" style="margin:6px 0 0">Dữ liệu lưu trên trình duyệt của thiết bị này.</p></div></div>`;


const GUIDE=[
 ['hub','Quản lý kỳ kiểm tra',`<p>Mỗi kỳ (VD <i>KTTX Lần 1 – Lớp 10A7</i>) có dữ liệu riêng: đề thi, mã đề, đáp án, bài chấm, ảnh phiếu. Vào <b>Quản lý kỳ kiểm tra</b> (trang chủ → <i>Mở kỳ này</i>, hoặc chạm tên kỳ ở đầu trang chủ) → chạm một kỳ để mở các chức năng: Quét trực tiếp · Đáp án · Học sinh · In phiếu · Kết quả · Thống kê · Xuất báo cáo.</p><p><b>Sửa kết quả</b>: Kết quả chấm → chạm tên học sinh → <i>Sửa bài làm</i> (sửa SBD, mã đề, từng câu) → <i>Lưu &amp; chấm lại</i>. <b>Chấm lại</b>: trong trang kỳ kiểm tra, <i>Chấm lại</i> (theo đáp án mới) hoặc <i>Đọc lại ảnh</i> (nhận diện lại từ ảnh đã lưu).</p>`],
 ['gb','Ghi điểm vào file lớp (mẫu Sở)',`<p>Học sinh → <b>Nhập Excel</b> chọn file danh sách lớp theo mẫu Sở (mỗi lớp một sheet, cột Tên lớp · Số báo danh · Họ và tên · KTTX 1–5 · GKI · CKI). App nhận đủ các lớp và lưu file này lại.</p><p>Đặt tên kỳ dạng <b>Lớp-Cột</b>: <i>10A7-KTTX1</i> → cột E, <i>10A7-KTTX4</i> → cột H, <i>10A7-GKI</i> → cột J, <i>10A7-CKI</i> → cột K; không ghi gì → cột E. Chấm xong: Kết quả → Xuất file → <b>Ghi điểm &amp; tải về</b>. Điểm các kỳ được cộng dồn vào cùng một file.</p>`],
 ['sync','Đồng bộ máy tính ↔ điện thoại',`<p>Dùng chung một tài khoản Google: sửa danh sách, đáp án, chấm bài ở máy nào thì máy kia cũng có. Dữ liệu nằm trong thư mục ẩn của app trên Google Drive của thầy cô.</p><ol><li>Mở app đã cài (địa chỉ GitHub Pages) → <b>Tài khoản</b> → <b>Đồng bộ</b> → <b>Kết nối Google Drive</b> → chọn tài khoản Google.</li><li>Làm giống vậy trên máy còn lại, cùng tài khoản Google.</li><li>Từ đó app tự đồng bộ sau mỗi thay đổi và mỗi phút. Mỗi lần mở lại app, chạm nút <b>☁ Chạm để đồng bộ</b> ở trang chủ.</li></ol><p><b>Tạo Google Client ID (làm 1 lần):</b> console.cloud.google.com → tạo dự án → <i>APIs &amp; Services › Library</i> bật <b>Google Drive API</b> → <i>OAuth consent screen</i>: External, tên QUMIRAI, thêm Gmail của thầy cô ở <i>Test users</i> → <i>Credentials › Create credentials › OAuth client ID</i>: Web application, <i>Authorized JavaScript origins</i> = <b>https://dtrung1212-max.github.io</b> → copy Client ID dán vào app.</p><p>Ảnh phiếu đã chấm không đồng bộ (dung lượng lớn), chỉ lưu trên máy đã chụp.</p>`],
 ['qr','Cập nhật đáp án bằng mã QR',`<p>Nhập đáp án → <b>Mã QR</b> → <b>Quét bằng camera</b>, đưa mã QR vào khung. Nhận cả mã QR “dành cho app chấm trắc nghiệm” trong file đáp án Word (dạng 0101, 0102…): một lần quét cập nhật đủ các mã đề, Phần I, II, III.</p><p>Không quét được bằng camera thì chọn <b>Chọn ảnh / file Word</b> — chọn ảnh chụp mã QR hoặc chính file .docx, app tự tìm mã QR trong file. Nếu số câu hoặc mẫu phiếu (mã 3 số/4 số) khác kỳ thi, app hỏi có đổi theo mã QR không.</p>`],
 ['quick','Bắt đầu nhanh',`<p><b>Xem thử ngay:</b> trên trang chủ bấm <b>▶ Thử ngay với phiếu mẫu</b> — app tự tô một phiếu và chấm cho bạn xem, không cần in.</p><p>Chấm thật chỉ cần 4 lần bấm:</p><ol class="gl"><li><b>Tạo kỳ thi</b>: đặt tên, chọn loại phiếu (mã đề 3 hay 4 số) và cấu trúc đề.</li><li><b>Nhập đáp án</b> cho từng mã đề. Khi đủ, nhãn trên khung camera đổi thành <i>Sẵn sàng</i>.</li><li><b>BẮT ĐẦU QUÉT</b> và đưa từng phiếu vào khung — hoặc <b>Chấm từ ảnh / PDF / hàng loạt</b>.</li><li><b>Bảng điểm</b> (hoặc tab Thống kê) để xem điểm, phổ điểm, phân tích và xuất Excel/PDF.</li></ol><div class="btns"><button class="btn" data-act="demo">Thử với phiếu mẫu</button><button class="btn ghost" data-act="newExam">Tạo kỳ thi</button></div>`],
 ['exam','Tạo kỳ thi và cách tính điểm',`<p>Chỉ cần 3 lựa chọn: <b>tên kỳ thi</b>, <b>loại phiếu</b> (nhìn ô “Mã đề thi” trên phiếu có 3 hay 4 cột) và <b>cấu trúc đề</b> (Toán 12·4·6, môn khác 18·4·6, chỉ trắc nghiệm 40 câu). Mã đề nhập ở bước sau (Nhập đáp án).</p><p>Muốn đổi số câu, điểm: mở mục <b>Tùy chỉnh</b> ở cuối màn hình tạo kỳ thi. Số câu mỗi phần được ít hơn số ô trên phiếu.</p><ul class="gl"><li><b>Phần I</b>: điểm mỗi câu đúng.</li><li><b>Phần II</b>: điểm của một câu khi đúng 1, 2, 3, 4 ý (mặc định 0,1 · 0,25 · 0,5 · 1).</li><li><b>Phần III</b>: điểm mỗi câu đúng.</li><li><b>Quy đổi về thang 10</b>: bật nếu tổng tối đa khác 10 mà bạn muốn chấm theo thang 10.</li></ul><p><b>Mã đề</b>: gõ cách nhau dấu phẩy, VD <i>101, 102, 103</i>. Sửa cấu trúc sau khi chấm: Quản lý bài thi → Sửa cấu trúc; app tự chấm lại mọi bài.</p>`],
 ['key','Nhập đáp án',`<ul class="gl"><li><b>Phần I</b>: gõ chuỗi <i>ABCDA…</i> rồi bấm Áp dụng, hoặc bấm A/B/C/D từng câu. Dấu “-” là câu chưa có đáp án.</li><li><b>Phần II</b>: gõ <i>ĐSĐS ĐĐSS …</i> (mỗi câu 4 ký tự; gõ D hay Đ đều được) hoặc chạm từng ý để đổi – → Đ → S.</li><li><b>Phần III</b>: gõ số như trên phiếu, VD <i>1,5</i> · <i>-2</i> · <i>0,25</i>. Tối đa 4 ký tự. App so theo giá trị (1,50 = 1,5).</li><li><b>Quét phiếu</b>: tô đáp án lên một phiếu (đúng mã đề), chụp hoặc chọn ảnh — app điền cả 3 phần.</li><li><b>Nhập từ Excel</b>: bấm <i>Tải file mẫu</i> → bảng dọc gồm cột <i>Phần</i> (I, II, III), cột <i>Câu\\Mã Đề</i> (1, 2, 3…) và mỗi mã đề một cột → điền đáp án → bấm <i>Nhập từ Excel</i>. Phần I ghi A/B/C/D, Phần II ghi 4 ký tự Đ/S (VD ĐĐĐS), Phần III ghi số (VD 8 · 100 · 1,5). Ghi X cho câu lỗi. Không có cột Phần vẫn nhận: số câu đánh lại từ 1 là sang phần mới. Bảng ngang (cột Mã đề + I.1, II.1, III.1) cũng nhận.</li><li><b>Mã QR</b>: <i>Tạo mã QR</i> để máy khác chụp và nhận đúng đáp án; <i>Đọc mã QR từ ảnh</i> để nhận đáp án từ máy khác.</li></ul><p><b>Câu lỗi</b>: nếu đề có câu sai, bấm nút <span class="xl">Lỗi</span> ở cuối câu đó (theo từng mã đề) — mọi học sinh được điểm tối đa câu đó dù tô thế nào; bài đã chấm tự cập nhật. Trong Excel ghi <i>X</i> vào ô của câu lỗi.</p><p><b>Mã đề</b>: thêm ở đầu màn Nhập đáp án (nút + Mã đề), hoặc tự tạo khi nhập Excel/QR/quét phiếu. Mã đề có dấu ✓ là đã đủ đáp án. Sửa đáp án lúc nào cũng được, điểm tự cập nhật.</p>`],
 ['stu','Danh sách học sinh',`<p>Bấm <b>Danh sách học sinh</b> ở trang chủ. Danh sách chia theo lớp: hàng nút <i>10A7 · 10A8…</i> — bấm lớp nào hiện học sinh lớp đó (có Đổi tên, Xoá lớp, Tạo kỳ thi lớp này). Nhập mỗi lớp một lần; file không có cột Lớp thì app hỏi tên lớp. Khi tạo kỳ thi, chọn lớp ở ô <b>Lớp chấm</b> (bấm mũi tên).</p><p>4 cách nhập:</p><ul class="gl"><li><b>Tải file mẫu</b> → điền cột SBD, Họ và tên, Lớp → <b>Nhập từ Excel</b>. Nhận cả file của trường có cột “Họ đệm” + “Tên”.</li><li><b>Mã QR</b>: <i>Tạo mã QR</i> để máy khác chụp nhận cả lớp (mỗi mã 20 em); <i>Đọc mã QR từ ảnh</i> để nhận danh sách.</li><li><b>Dán từ Excel</b>: copy 3 cột SBD, Họ tên, Lớp rồi dán.</li></ul><p>SBD trùng sẽ được cập nhật họ tên; có thể chọn <i>Thay cả danh sách</i>. Bảng điểm hiện thêm mục “Chưa có bài” để biết em nào chưa nộp.</p>`],
 ['scan','Quét bằng camera',`<ul class="gl"><li>Đặt phiếu trên mặt bàn phẳng, nền tối càng tốt; đủ sáng, tránh bóng điện thoại đè lên phiếu.</li><li>Đưa <b>cả tờ phiếu</b> vào khung, thấy rõ <b>4 ô vuông đen ở 4 góc</b>. Nghiêng nhẹ hay xoay ngược vẫn đọc được.</li><li>Viền chuyển <b>xanh</b> = đã thấy đủ 4 ô → bấm <b>nút tròn</b> để chụp → xem ảnh → <b>Dùng ảnh này</b> (hoặc <b>Chụp lại</b>). App chấm, lưu và hiện thẻ điểm.</li><li>Bật <b>Tự chấm</b> nếu muốn: giữ phiếu yên ~1 giây là app tự chụp và chấm, không cần bấm.</li><li>Nếu báo <i>chưa được cấp quyền camera</i>: chạm biểu tượng ổ khoá cạnh địa chỉ trang → Quyền → Máy ảnh → Cho phép. Nếu báo <i>camera đang bận</i>: đóng ứng dụng gọi video/máy ảnh khác. Bấm <b>Kết thúc</b> để tắt camera.</li><li>Thanh 6 bước phía dưới cho biết app đang ở bước nào; dòng chữ phía trên báo lỗi nếu có.</li><li>Quét lại cùng SBD sẽ <b>cập nhật</b> điểm cũ, không tạo bản trùng.</li></ul><p><b>Cảnh báo SBD</b>: nếu số báo danh tô sai (thiếu/tô 2 ô), trùng với bài đã chấm, hoặc không có trong danh sách lớp, app dừng lại và hiện ảnh phần SBD để đối chiếu. Chọn <i>Chỉnh sửa</i> để gõ lại SBD/mã đề, hoặc <i>Vẫn cập nhật</i> để lưu như đã đọc (trùng SBD thì bài mới thay bài cũ).</p><p class="note">Trong ứng dụng Claude, trình xem không cho mở camera liên tục: bấm <b>BẮT ĐẦU QUÉT</b> là camera điện thoại mở ngay để chụp; chụp xong app chấm và lưu, chạm <i>Chụp phiếu tiếp</i> cho phiếu sau. Muốn quét liên tục, đưa file index.html lên một trang web có HTTPS (VD GitHub Pages) rồi mở bằng trình duyệt điện thoại.</p>`],
 ['files','Chấm từ ảnh, PDF, hàng loạt',`<ul class="gl"><li>Bấm <b>Chấm từ ảnh</b> / <b>Chấm từ PDF</b> / <b>Chấm hàng loạt</b> rồi chọn: <i>thư mục</i>, <i>nhiều file</i> hoặc <i>1 file</i>. Mỗi ảnh hoặc mỗi trang PDF là một phiếu.</li><li><b>Chọn thư mục</b>: app chấm mọi ảnh/PDF trong thư mục theo thứ tự tên file. Khi có thêm phiếu, bỏ vào cùng thư mục rồi bấm <i>Cập nhật thư mục</i> (hoặc chọn lại thư mục) — app chỉ chấm file mới và file lần trước bị lỗi, bỏ qua file đã chấm xong; muốn chấm lại hết bấm <i>Chấm lại tất cả</i>.</li><li>Điện thoại nào không chọn được thư mục thì nút này mở chọn nhiều file: chọn tất cả file trong thư mục.</li><li>Chọn 1 phiếu: xem ngay ảnh đã đánh dấu (xanh đúng, đỏ sai, vàng là đáp án đúng) và sửa SBD/mã đề nếu cần.</li><li>Chọn nhiều phiếu: app chấm lần lượt, lưu bài hợp lệ, liệt kê phiếu lỗi để xử lý riêng.</li></ul><p>Máy scan: quét màu hoặc xám, 150–300 dpi, không cắt mất 4 ô vuông góc.</p>`],
 ['fill','Hướng dẫn học sinh tô phiếu',`<ul class="gl"><li>Dùng bút chì đen (2B) hoặc bút bi đậm, <b>tô kín</b> cả ô tròn.</li><li>Ghi và tô đủ <b>số báo danh</b> và <b>mã đề</b>, mỗi cột một chữ số.</li><li><b>Phần I</b>: mỗi câu tô 1 ô A/B/C/D. Tô 2 ô bị tính sai.</li><li><b>Phần II</b>: mỗi ý a, b, c, d tô 1 ô Đúng hoặc Sai.</li><li><b>Phần III</b>: mỗi cột một ký tự, viết từ ô bên trái. Dấu “-” chỉ ở cột đầu; dấu “,” ở cột 2 hoặc 3. VD <i>-1,5</i>: cột 1 tô “-”, cột 2 tô 1, cột 3 tô “,”, cột 4 tô 5.</li><li>Không gấp phiếu, không viết vẽ lên 4 ô vuông đen và vùng ô tròn.</li></ul>`],
 ['fix','Sửa kết quả khi đọc sai',`<p>Sau khi chấm từ ảnh, màn hình <b>Kết quả chấm</b> cho sửa SBD và mã đề rồi bấm Lưu. Muốn xoá một bài: Bảng điểm → chạm vào dòng → Xoá bài này.</p><p>Ô tô nhạt bị bỏ sót, hoặc vết bẩn bị nhận là ô tô: chỉnh <b>Độ nhạy ô tô</b> trong Tài khoản (giảm để nhận ô nhạt, tăng để bỏ vết bẩn).</p>`],
 ['err','Lỗi thường gặp',`<table class="gt"><tr><th>App báo</th><th>Cách xử lý</th></tr><tr><td>Chưa thấy đủ 4 ô vuông đen</td><td>Lùi điện thoại ra cho thấy cả tờ; bỏ vật che góc phiếu.</td></tr><tr><td>Phiếu không đúng mẫu</td><td>Phiếu mẫu 3 số mà kỳ thi chọn mẫu 4 số (hoặc ngược lại) — sửa mẫu phiếu của kỳ thi.</td></tr><tr><td>Ảnh quá tối hoặc lóa</td><td>Bật đèn phòng/đèn flash, tránh ánh nắng chiếu thẳng.</td></tr><tr><td>Chưa đọc được SBD / mã đề</td><td>Học sinh tô thiếu hoặc tô 2 ô một cột — sửa tay ở màn hình kết quả.</td></tr><tr><td>Mã đề … chưa có trong kỳ thi</td><td>Thêm mã đề ở Quản lý mã đề và nhập đáp án.</td></tr></table>`],
 ['install','Cài QUMIRAI lên điện thoại như app',`<ol class="gl"><li>Đưa bộ file app (index.html, manifest.webmanifest, sw.js và các file icon) lên một trang web https miễn phí, ví dụ GitHub Pages: tạo kho → <i>Add file → Upload files</i> chọn tất cả file → <i>Commit</i> → <i>Settings → Pages</i> → nhánh <i>main</i>, thư mục <i>/ (root)</i> → <i>Save</i>.</li><li>Mở địa chỉ <i>https://tên-tài-khoản.github.io/tên-kho/</i> bằng <b>Chrome</b> trên Android.</li><li>Bấm nút <b>Cài app</b> trên đầu trang chủ, hoặc <b>⋮ → Cài đặt ứng dụng</b>. iPhone: mở bằng Safari → <b>Chia sẻ → Thêm vào MH chính</b>.</li><li>Biểu tượng <b>QUMIRAI</b> xuất hiện trong danh sách ứng dụng; mở ra toàn màn hình, camera chụp trực tiếp, dùng được cả khi mất mạng.</li></ol><p class="note">Cập nhật bản mới: tải đè các file mới lên GitHub; app tự lấy bản mới lần mở sau khi có mạng. Dữ liệu chấm vẫn giữ nguyên.</p>`],
 ['acc','Tài khoản và thời hạn sử dụng',`<p><b>Giáo viên</b>: nhận tin nhắn hoặc ảnh QR từ quản trị viên → mở QUMIRAI → gõ <i>tên đăng nhập</i> và dán <i>mã kích hoạt</i> (hoặc bấm <i>Kích hoạt bằng ảnh mã QR</i>). Xem hạn dùng ở <b>Tài khoản</b>. Hết hạn thì app khoá, nhập mã gia hạn mới là dùng tiếp, dữ liệu vẫn còn.</p><p><b>Quản trị viên</b>: Tài khoản → <b>Quản trị tài khoản</b> → nạp file khoá quản trị (một lần trên máy của mình) → nhập họ tên, tên đăng nhập, thời hạn → <i>Tạo mã kích hoạt</i> → gửi tin nhắn/ảnh QR cho giáo viên. Gia hạn = cấp lại cùng tên đăng nhập với ngày mới.</p><p class='note'>Giữ kín file khoá quản trị: ai có file này đều cấp được tài khoản.</p>`],
 ['data','Thống kê, xuất file và sao lưu',`<ul class="gl"><li>Tab <b>Thống kê</b> ở thanh dưới (hoặc 4 nút trên trang chủ) gồm 4 mục: Bảng điểm · Phổ điểm · Câu hỏi · Xuất file.</li><li><b>Bảng điểm</b>: điểm Phần I, II, III và tổng; sắp theo SBD, theo điểm hoặc mới chấm. Chạm một dòng để xem bài làm.</li><li><b>Phổ điểm</b>: số bài theo khoảng điểm, trung bình, trung vị, tỉ lệ đạt.</li><li><b>Phân tích câu hỏi</b>: tỉ lệ đúng từng câu, từng ý Đúng/Sai, đáp án sai hay gặp ở Phần III; lọc theo mã đề.</li><li><b>Xuất Excel</b> gồm 3 trang: Bảng điểm, Bài làm, Đáp án. <b>Xuất PDF</b> bảng điểm để in. Chọn thứ tự: <i>Theo danh sách HS</i> (đúng thứ tự danh sách đã nhập, em chưa có bài ghi “Chưa có bài”), theo SBD hoặc theo điểm.</li><li><b>Ảnh phiếu đã chấm</b>: mỗi phiếu được lưu ảnh khi chấm; xuất ảnh có ghi họ tên, điểm và khoanh xanh lá = đúng, đỏ = sai, vàng = chưa làm. Tải từng em (chạm vào tên trong Bảng điểm) hoặc cả lớp dạng ZIP/PDF. Ảnh tự cập nhật khi sửa đáp án hay đánh dấu câu lỗi.</li></ul><p class="note">Dữ liệu và ảnh phiếu chỉ lưu trên trình duyệt của máy đang dùng (bản sao lưu không gồm ảnh). <b>Xoá hàng loạt</b>: Tài khoản → Dữ liệu → <i>Xoá dữ liệu…</i> (chọn mã đề, bài đã chấm, ảnh phiếu, học sinh, kỳ thi…), hoặc nút xoá tất cả ở màn Quản lý mã đề, Bảng điểm, Danh sách học sinh. Vào Thống kê → Xuất file → <b>Tải bản sao lưu</b> thường xuyên; đổi máy thì dùng <b>Khôi phục từ file</b>.</p>`]];
V.guide=()=>`${sub('Hướng dẫn sử dụng')}<div class="wrap"><p class="muted small" style="margin:2px 2px 8px">Chạm vào từng mục để xem chi tiết.</p>${GUIDE.map(([id,t,h],i)=>`<details class="gd" id="g-${id}" ${i===0||id===guideOpen?'open':''}><summary><span class="gn">${i+1}</span>${t}</summary><div class="gb">${h}</div></details>`).join('')}<p class="copy" style="margin-top:12px">${esc(COPY)}</p></div>`;
let guideOpen=null;

/* ---------- accounts: signed activation codes (ECDSA P-256) ---------- */
const LIC_PUB={"kty":"EC","crv":"P-256","x":"DHHZxNk0TJoh4wKoFqkuI6IsYtKgHNfJ_KV8T2AErMI","y":"ximAgdX6HIzZh16ALK2-Wqf11AQ-1YPJ9MvkePgzVCw"},LIC_KEY='qumirai-lic',LIC_SEEN='qumirai-seen',ADM_KEY='qumirai-admkey';
const b64e=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64d=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return Uint8Array.from(atob(t),c=>c.charCodeAt(0))};
let LIC={ok:false,checked:false,p:null,why:''},pubKeyP=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(x){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(x){}};
const todayStr=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const vnDate=s=>s?s.split('-').reverse().join('/'):'';
function nowSafe(){const n=Date.now(),seen=+(lsGet(LIC_SEEN)||0);const t=Math.max(n,seen);if(n>seen)lsSet(LIC_SEEN,String(n));return new Date(t)} // chống chỉnh lùi đồng hồ
async function licDecode(code){code=String(code||'').replace(/\s+/g,'');const parts=code.split('.');if(parts.length!==2||!parts[0]||!parts[1])throw new Error('Mã kích hoạt không đúng định dạng');
 if(!(window.crypto&&crypto.subtle))throw new Error('Trình duyệt không hỗ trợ kiểm tra mã (cần Chrome mới, địa chỉ https)');
 let pb,sg;try{pb=b64d(parts[0]);sg=b64d(parts[1])}catch(x){throw new Error('Mã kích hoạt bị sai ký tự')}
 pubKeyP=pubKeyP||crypto.subtle.importKey('jwk',LIC_PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},await pubKeyP,sg,pb);if(!ok)throw new Error('Mã kích hoạt không hợp lệ (sai chữ ký)');
 let p;try{p=JSON.parse(new TextDecoder().decode(pb))}catch(x){throw new Error('Mã kích hoạt bị hỏng')}return p}
const daysLeft=p=>Math.floor((new Date(p.e+'T23:59:59')-nowSafe())/864e5)+1;
async function licCheck(){const code=lsGet(LIC_KEY);if(!code){LIC={ok:false,checked:true,p:null,why:'new'};return LIC}
 try{const p=await licDecode(code);const dl=daysLeft(p);LIC={ok:dl>0,checked:true,p,why:dl>0?'':'expired',code}}catch(x){LIC={ok:false,checked:true,p:null,why:'bad'}}return LIC}
async function licLogin(user,code){const p=await licDecode(code);if(String(user||'').trim().toLowerCase()!==String(p.u).toLowerCase())throw new Error('Tên đăng nhập không khớp với mã kích hoạt');
 if(daysLeft(p)<=0)throw new Error(`Mã này đã hết hạn ngày ${vnDate(p.e)} — liên hệ quản trị viên để gia hạn`);lsSet(LIC_KEY,code.replace(/\s+/g,''));return licCheck()}
function showLock(){const L=$('#lock');L.hidden=false;document.body.style.overflow='hidden';$('#lkVer').textContent=`QUMIRAI v${VER} · Phát triển bởi thầy Phan Đình Trung`;$('#lkErr').textContent='';
 if(LIC.why==='expired'&&LIC.p){$('#lkTitle').textContent='Tài khoản đã hết hạn';$('#lkMsg').innerHTML=`Tài khoản <b>${esc(LIC.p.n||LIC.p.u)}</b> hết hạn ngày <b>${vnDate(LIC.p.e)}</b>. Nhập mã gia hạn mới do quản trị viên cấp. Dữ liệu chấm của thầy/cô vẫn được giữ nguyên.`;$('#lkUser').value=LIC.p.u}
 else if(LIC.why==='bad'){$('#lkTitle').textContent='Đăng nhập lại';$('#lkMsg').textContent='Mã kích hoạt đã lưu không còn hợp lệ. Nhập lại mã do quản trị viên cấp.'}
 else{$('#lkTitle').textContent='Đăng nhập';$('#lkMsg').textContent='Nhập tên đăng nhập và mã kích hoạt do quản trị viên cấp.'}}
function hideLock(){$('#lock').hidden=true;document.body.style.overflow=''}
async function doLogin(user,code){$('#lkErr').textContent='';$('#lkGo').disabled=true;$('#lkGo').textContent='Đang kiểm tra…';
 try{await licLogin(user,code);hideLock();toast(`Xin chào ${LIC.p.n||LIC.p.u} — tài khoản dùng đến ${vnDate(LIC.p.e)}`,3500);closeModal();render()}catch(x){$('#lkErr').textContent=x.message}finally{$('#lkGo').disabled=false;$('#lkGo').textContent='Đăng nhập'}}
$('#lkGo').onclick=()=>doLogin($('#lkUser').value,$('#lkCode').value);

function parseKeyAOA(aoa,e){const nd=TP[e.tpl].made.length,out={},warn=[],T=v=>String(v??'').trim(),MD=/m[ãa]\s*đ[ềe]/i;

 out.innerHTML=`<div class="bhead">${B.dir?`Thư mục <b>${esc(B.dir)}</b> · `:''}${B.files.length} file${skip?` · <span class="tag">${skip} file đã chấm xong trước đó — bỏ qua</span> <button class="link" data-act="batchAll">Chấm lại tất cả</button>`:''}</div>${todo.length?'<div class="prog"><i style="width:2%"></i></div><p class="muted small" id="bSt">Đang chấm…</p>':'<p class="muted">Không có file mới trong thư mục. Thêm ảnh/PDF vào thư mục rồi chọn lại, hoặc bấm “Chấm lại tất cả”.</p>'}<ul class="list" id="bList"></ul>`;
 let ok=0,bad=0,n=0;const add=li=>{const L=$('#bList');L&&L.insertAdjacentHTML('beforeend',li)},stat=()=>{const p=$('.prog i'),t=$('#bSt');if(p)p.style.width=(n/Math.max(1,todo.length)*100)+'%';if(t)t.textContent=`${n}/${todo.length} file · ${ok} bài đã lưu · ${bad} cần xem`};
 const one=async(c,label,src)=>{const g=gradeCanvas(c,src),o=g.ok&&g.res?await commitResult(e,g.res,g.rect):null;
  if(o){ok++;add(`<li><div class="grow"><b>${esc(stu(o.res.sbd)?.name||'SBD '+o.res.sbd)}</b><div class="muted small">${esc(label)} · mã ${o.res.made}${o.res.sbd!==g.r.sbd?' · đã sửa SBD':''}</div></div><span class="score">${fmt(o.res.score)}</span></li>`)}
  else{bad++;const why=!g.ok?g.r.why:!g.known?`Mã đề ${g.r.made} chưa có trong kỳ thi`:'Đã bỏ qua (SBD cần kiểm tra)';add(`<li><div class="grow">${esc(label)}<div class="muted small">${esc(why)}</div></div><span class="tag bad">Cần xem</span></li>`)}return!!o};
 for(const f of todo){try{let all=true;if(isPdf(f))await pdfEach(f,async(c,label)=>{if(!await one(c,label,'pdf'))all=false});else if(isImg(f))all=await one(await imgCanvas(f),f.name,'batch');else throw new Error('Không phải ảnh/PDF');if(all&&!done.has(fkey(f)))e.done.push(fkey(f))}
  catch(x){bad++;add(`<li><div class="grow">${esc(f.name)}<div class="muted small">${esc(x.message||'Không đọc được file')}</div></div><span class="tag bad">Lỗi</span></li>`)}
  n++;stat();await new Promise(r=>setTimeout(r,0))}
 if(e.done.length>3000)e.done=e.done.slice(-3000);save();
 if(todo.length){out.insertAdjacentHTML('beforeend',`<div class="btns"><button class="btn" data-go="scores">Xem bảng điểm</button>${B.dir?'<button class="btn ghost" data-act="folderAgain">Cập nhật thư mục</button>':''}</div>`);toast(`Xong: ${ok} bài đã lưu`)}}

async function reReadOne(e,r){const b=await IDB.get(imgKey(e,r.sbd));if(!b)return null;const u=URL.createObjectURL(b),im=await loadImg(u);URL.revokeObjectURL(u);
 const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);
 const k=im.width/2480,g=gray(x.getImageData(0,0,c.width,c.height).data,c.width*c.height),H=[k,0,0,0,k,0,0,0,1],black=CORNERS.reduce((s,[px,py])=>s+sampleC(g,c.width,c.height,H,px,py,20),0)/4;

 for(const r of rs){const o=await reReadOne(e,r);if(!o){no++;continue}n++;const before=r.a1+r.a2.join()+r.a3.join();r.a1=o.a1;r.a2=o.a2;r.a3=o.a3;r.p3=o.a3pos;if(before!==r.a1+r.a2.join()+r.a3.join())ch++}

function camHint(cw,ch){const o=$('#ovl'),f=$('#frame');if(!o||!f||f.style.display==='none')return null;const R=o.getBoundingClientRect(),F=f.getBoundingClientRect();if(!F.width||!R.width)return null;
 const k=Math.min(R.width/cw,R.height/ch),ox=(R.width-cw*k)/2,oy=(R.height-ch*k)/2,C=(x,y)=>[(x-R.left-ox)/k,(y-R.top-oy)/k];
 return{pts:[C(F.left,F.top),C(F.right,F.top),C(F.right,F.bottom),C(F.left,F.bottom)],r:F.width*.24/k}}
function boxHits(r,hint){let n=0;const B=document.querySelectorAll('#frame i');B.forEach((b,i)=>{const h=!!(r&&r.P&&hint&&Math.hypot(r.P[i][0]-hint.pts[i][0],r.P[i][1]-hint.pts[i][1])<hint.r);if(h)n++;b.classList.toggle('hit',h)});$('#frame').classList.toggle('fok',n===4&&!!(r&&r.ok));return hint?n:4}
function drawOverlay(r,pc){const o=$('#ovl'),W=o.clientWidth,H=o.clientHeight;if(o.width!==W)o.width=W;if(o.height!==H)o.height=H;const x=o.getContext('2d');x.clearRect(0,0,W,H);if(!r||!r.P)return;
 const vw=pc.width,vh=pc.height,k=Math.min(W/vw,H/vh),ox=(W-vw*k)/2,oy=(H-vh*k)/2,T=p=>[p[0]*k+ox,p[1]*k+oy];
 x.lineWidth=2.5;x.strokeStyle=r.ok?'#22c55e':'#facc15';r.P.forEach(p=>{const[u,v]=T(p);x.beginPath();x.arc(u,v,9,0,7);x.stroke()})}
const rkey=r=>[r.sbd,r.made,r.a1,r.a2.join(''),r.a3.join('|')].join('#');
let needClear=false,clearN=0,grading=false;
function loop(){if(!scanOn||mode!=='live'||!stream)return;const v=$('#vid');let wait=70;
 if(paused||grading){timer=setTimeout(loop,200);return}
 if(v.readyState>=2&&v.videoWidth){const pc=toCanvas(v,760),e=ex(),hint=camHint(pc.width,pc.height),r=analyze(pc,e.tpl,hint,{detect:1});drawOverlay(r,pc);const hits=boxHits(r,hint);
  if(needClear){if(hits<3){if(++clearN>=3)needClear=false}else clearN=0;setStep(5,'Đã chấm — đưa phiếu tiếp theo vào 4 ô');holdT=0}
  else if(!r.ok||hits<4){holdT=0;setStep(r.step===1?1:0,r.step===1?r.why:hits?`Đưa 4 chấm đen vào 4 ô vuông (${hits}/4)`:'Đưa 4 chấm đen ở 4 góc phiếu vào 4 ô vuông')}
  else{const now=performance.now();if(!holdT)holdT=now;const held=(now-holdT)/1000;
   if(held<.6)setStep(2,`Đủ 4 ô — giữ yên ${Math.max(0,.6-held).toFixed(1).replace('.',',')}s`);
   else{holdT=0;grading=true;setStep(3,'Đang chấm…');setTimeout(()=>autoGrade(v,e).finally(()=>{grading=false;timer=setTimeout(loop,300)}),0);return}}}
 timer=setTimeout(loop,wait)}
async function autoGrade(v,e){const big=toCanvas(v,1800),hint=camHint(big.width,big.height),r=analyze(big,e.tpl,hint);
 if(!r.ok){beep(false);setStep(1,r.why);return}
 needClear=true;clearN=0;
 if(r.made.includes('?')){beep(false);showCard(null,r,'Chưa đọc được mã đề — kiểm tra phần tô mã đề');return}
 if(!e.codes[r.made]){beep(false);showCard(null,r,`Mã đề ${r.made} chưa có trong kỳ thi`);return}
 const res=mkResult(e,{sbd:r.sbd,made:r.made,a1:r.a1,a2:r.a2,a3:r.a3,p3:r.a3pos,src:'camera'}),rect=rectify(big,r);paused=true;
 try{const o=await commitResult(e,res,rect);if(!o){showCard(null,r,'Đã bỏ qua phiếu này');return}sess++;$('#sCount').textContent=sess;beep(true);setStep(5,'Đã lưu — đưa phiếu tiếp theo vào 4 ô');
  let url='';try{const m=await markedSheet(e,o.res,rect);url=m.toDataURL('image/jpeg',.82)}catch(x){}showCard(o.res,o.res,o.st==='updated'?'Đã cập nhật điểm':'Đã lưu',url)}finally{paused=false}}

$('#sShot').onclick=()=>{const v=$('#vid');if(!stream||!v.videoWidth){toast('Camera chưa sẵn sàng');return}initAudio();clearTimeout(timer);
 shotCv=toCanvas(v,2000);{const sc=toCanvas(shotCv,1400);shotR=analyze(sc,ex().tpl,camHint(sc.width,sc.height))}try{v.pause()}catch(x){}
 mode='review';$('#still').src=shotCv.toDataURL('image/jpeg',.85);$('#still').hidden=false;$('#vid').hidden=true;$('#ovl').getContext('2d').clearRect(0,0,9999,9999);$('#frame').style.display='none';$('#ctlLive').hidden=true;$('#ctlReview').hidden=false;
 $('#sMsg').textContent=shotR.ok?'Ảnh rõ, đủ 4 ô định vị — bấm “Dùng ảnh này” để chấm':'⚠ '+shotR.why+' — nên chụp lại';$('#sUse').classList.toggle('ghost',!shotR.ok)};

$('#sUse').onclick=async()=>{if(!shotCv)return;$('#sMsg').textContent='Đang chấm…';$('#sUse').disabled=true;
 try{const e=ex(),g=gradeCanvas(shotCv,'camera');

  const o=await commitResult(e,g.res,g.rect);LAST=g;
  if(!o){showCard(null,g.r,'Đã bỏ qua phiếu này')}else{LAST.res=o.res;LAST.saved=o.st;sess++;$('#sCount').textContent=sess;beep(true);showCard(o.res,o.res,o.st==='updated'?'Đã cập nhật điểm':'Đã lưu')}

function showCard(res,r,msg,img){const e=ex(),n=stu(r.sbd)?.name;$('#sCard').innerHTML=`${img?`<img class="s-shot" src="${img}" alt="Phiếu đã chấm" data-big="1">`:''}<div class="s-card ${res?'':'err'}"><div class="sc">${res?fmt(res.score):'!'}</div><div class="grow"><b>${esc(n||'SBD '+r.sbd)}</b><div style="font-size:12.5px;color:#5b6b86">SBD ${esc(r.sbd)} · Mã ${esc(r.made)}${res?` · ${[e.n1?'I '+fmt(res.s1):'',e.n2?'II '+fmt(res.s2):'',e.n3?'III '+fmt(res.s3):''].filter(Boolean).join(' · ')}`:''}</div><div style="font-size:13px;font-weight:600;color:${res?'#16a34a':'#e11d48'}">${esc(msg)}</div></div></div>`;clearTimeout(cardT);cardT=setTimeout(()=>$('#sCard').innerHTML='',img?9000:4500);const im=$('#sCard .s-shot');if(im)im.onclick=()=>{clearTimeout(cardT);const d=document.createElement('div');d.className='s-full';d.innerHTML=`<img src="${img}" alt=""><button aria-label="Đóng">✕</button>`;d.onclick=()=>d.remove();$('#scan').appendChild(d)}}
async function gradeFile(f){if(!f)return;$('#sMsg').textContent='Đang nhận diện…';$('#fbState').textContent='Đang chấm…';
 try{const c=await imgCanvas(f),e=ex(),g=gradeCanvas(c,'camera');

  const o=await commitResult(e,g.res,g.rect);LAST=g;

 catch(err){showCard(null,{sbd:'?',made:'?'},'Không đọc được ảnh — chụp lại');shotDone(false)}}
